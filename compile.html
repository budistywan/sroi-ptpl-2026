<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kajian SROI — PTPL 2026 (Compile)</title>

  <link rel="stylesheet" href="styles/master.css" />
</head>

<body>
  <div id="boot" style="position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(245,247,249,.92); z-index:9999; font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;">
    <div style="width:min(560px,92vw); padding:18px 18px; border:1px solid rgba(15,47,74,.12); border-radius:14px; background:#fff; color:#0F2F4A;">
      <div style="font-weight:900; margin:0 0 6px 0;">Menyusun dokumen…</div>
      <div style="opacity:.75; margin:0;">Memuat halaman & menerapkan pagination (Paged.js).</div>
      <div id="bootLog" style="margin-top:10px; font-size:12px; opacity:.75; line-height:1.4; max-height:170px; overflow:auto;"></div>
    </div>
  </div>

  <main id="doc" aria-label="SROI flow document"></main>

  <script>
    const FILES = [
      "bab-00-pengantar/00-cover.html",
      "bab-00-pengantar/01-pengesahan.html",
      "bab-00-pengantar/02-kata-pengantar.html",
      "bab-00-pengantar/03-ringkasan-eksekutif.html",
      "bab-00-pengantar/04-daftar-isi.html",
      "bab-00-pengantar/05-daftar-tabel.html",
      "bab-00-pengantar/06-daftar-gambar.html",

      "bab-01-pendahuluan/index.html",
      "bab-02-profil-perusahaan/index.html",
      "bab-03-metodologi/index.html",
      "bab-04-kondisi-awal/index.html",
      "bab-05-kondisi-ideal/index.html",
      "bab-06-strategi/index.html",
      "bab-07-implementasi/index.html",
      "bab-08-triple-loop-learning/index.html",
      "bab-09-penutup/index.html",
      "bab-10-komponensi-penyusun/index.html"
    ];

    const $doc = document.getElementById("doc");
    const $boot = document.getElementById("boot");
    const $bootLog = document.getElementById("bootLog");

    function log(msg){
      const div = document.createElement("div");
      div.textContent = msg;
      $bootLog.appendChild(div);
      $bootLog.scrollTop = $bootLog.scrollHeight;
      console.log(msg);
    }

    async function loadHTML(path){
      log("Load: " + path);
      const res = await fetch(path, { cache: "no-store" });
      if(!res.ok) throw new Error(`${path} (${res.status})`);
      return await res.text();
    }

    function loadPagedJS(){
      return new Promise((resolve, reject) => {
        const local = document.createElement("script");
        local.src = "vendor/paged.polyfill.js";
        local.onload = () => {
          // If still placeholder, it won't create PagedPolyfill; then fallback to CDN
          if (window.PagedPolyfill && typeof window.PagedPolyfill.preview === "function") return resolve("local");
          // fallback CDN
          const cdn = document.createElement("script");
          cdn.src = "https://unpkg.com/pagedjs/dist/paged.polyfill.js";
          cdn.onload = () => resolve("cdn");
          cdn.onerror = () => reject(new Error("Gagal load Paged.js (local & CDN)."));
          document.head.appendChild(cdn);
        };
        local.onerror = () => {
          const cdn = document.createElement("script");
          cdn.src = "https://unpkg.com/pagedjs/dist/paged.polyfill.js";
          cdn.onload = () => resolve("cdn");
          cdn.onerror = () => reject(new Error("Gagal load Paged.js (local & CDN)."));
          document.head.appendChild(cdn);
        };
        document.head.appendChild(local);
      });
    }

    async function build(){
      // 1) load Paged.js
      const src = await loadPagedJS();
      log("Paged.js: " + src);

      // 2) load content
      let merged = "";
      for (const f of FILES){
        const html = await loadHTML(f);
        merged += `\n<!-- ===== ${f} ===== -->\n` + html + "\n";
      }
      $doc.innerHTML = merged;

      // 3) paginate
      if (window.PagedPolyfill && typeof window.PagedPolyfill.preview === "function") {
        log("PagedPolyfill.preview()");
        await window.PagedPolyfill.preview();
      } else {
        log("Paged.js auto-run (preview() not called).");
      }

      $boot.style.display = "none";
    }

    build().catch(err => {
      console.error(err);
      log("ERROR: " + err.message);
      log("Cek: path file benar? GitHub Pages aktif? master.css 200?");
      // loader stays visible
    });
  </script>
</body>
</html>

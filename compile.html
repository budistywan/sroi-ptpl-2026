<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SROI PTPL 2026 — Compile</title>

  <!-- Master CSS -->
  <link rel="stylesheet" href="styles/master.css" />

  <!-- Paged.js Polyfill (CDN ONLY — no manual vendor file needed) -->
  <script src="https://unpkg.com/pagedjs/dist/paged.polyfill.js"></script>

  <style>
    /* tiny helpers for screen preview */
    body{ margin:0; background:#F5F7F9; }
    .loading{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial, sans-serif;
      color:#0F2F4A; font-weight:700;
      position:fixed; inset:18px auto auto 18px;
      background:#fff; border:1px solid rgba(15,47,74,.10);
      padding:10px 12px; border-radius:10px;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
      z-index:99999;
    }
    .loading small{ display:block; font-weight:600; opacity:.7; margin-top:4px; }
    .loading.err{ border-color: rgba(229,57,53,.35); }
    @media print{ .loading{ display:none !important; } }
  </style>
</head>

<body>
  <div id="loading" class="loading">
    Menyusun dokumen…
    <small>Memuat halaman & menerapkan pagination (Paged.js)</small>
  </div>

  <!-- All content will be injected here -->
  <main id="doc"></main>

  <script>
    /**
     * SROI Compile Loader (browser-only, GitHub Pages friendly)
     * - Loads partial HTML files (per bab / subbab) into #doc
     * - After all loaded: triggers Paged.js pagination
     */
    const PARTIALS = [
      // bab-00 pengantar
      "bab-00-pengantar/00-cover.partial.html",
      "bab-00-pengantar/01-pengesahan.partial.html",
      "bab-00-pengantar/02-kata-pengantar.partial.html",
      "bab-00-pengantar/03-ringkasan-eksekutif.partial.html",
      "bab-00-pengantar/04-daftar-isi.partial.html",
      "bab-00-pengantar/05-daftar-tabel.partial.html",
      "bab-00-pengantar/06-daftar-gambar.partial.html",

      // bab-01 pendahuluan
      "bab-01-pendahuluan/00-bab.partial.html",
      "bab-01-pendahuluan/01-1-1-latar-belakang.partial.html",
      "bab-01-pendahuluan/02-1-2-tujuan-luaran.partial.html",
      "bab-01-pendahuluan/03-1-3-ruang-lingkup.partial.html",
      "bab-01-pendahuluan/04-1-4-konsiderasi-hukum.partial.html",

      // bab-02 profil perusahaan
      "bab-02-profil-perusahaan/00-bab.partial.html",
      "bab-02-profil-perusahaan/01-2-1-lingkup-usaha.partial.html",
      "bab-02-profil-perusahaan/02-2-2-visi-misi.partial.html",
      "bab-02-profil-perusahaan/03-2-3-strategi-pemberdayaan.partial.html",
      "bab-02-profil-perusahaan/04-2-4-jenis-program.partial.html",

      // bab-03 metodologi
      "bab-03-metodologi/00-bab.partial.html",
      "bab-03-metodologi/01-3-1-sroi.partial.html",
      "bab-03-metodologi/02-3-2-pengumpulan-analisis.partial.html",
      "bab-03-metodologi/03-3-3-tahapan-perhitungan.partial.html",
      "bab-03-metodologi/04-3-4-evaluasi-kualitatif.partial.html",
      "bab-03-metodologi/05-3-5-prinsip-sroi.partial.html",
      "bab-03-metodologi/06-3-6-lfa.partial.html",
      "bab-03-metodologi/07-3-7-exit-strategy.partial.html",
      "bab-03-metodologi/08-3-8-loop-learning.partial.html",

      // bab-04 kondisi awal
      "bab-04-kondisi-awal/00-bab.partial.html",
      "bab-04-kondisi-awal/01-4-1-geografis-demografis.partial.html",
      "bab-04-kondisi-awal/02-4-2-akar-masalah.partial.html",
      "bab-04-kondisi-awal/03-4-3-permasalahan-spesifik.partial.html",
      "bab-04-kondisi-awal/04-4-4-potensi.partial.html",

      // bab-05 kondisi ideal
      "bab-05-kondisi-ideal/00-bab.partial.html",
      "bab-05-kondisi-ideal/01-5-1-tujuan-utama.partial.html",
      "bab-05-kondisi-ideal/02-5-2-tujuan-spesifik.partial.html",
      "bab-05-kondisi-ideal/03-5-3-kesesuaian.partial.html",

      // bab-06 strategi
      "bab-06-strategi/00-bab.partial.html",
      "bab-06-strategi/01-6-1-filosofi.partial.html",
      "bab-06-strategi/02-6-2-relevansi.partial.html",
      "bab-06-strategi/03-6-3-roadmap.partial.html",
      "bab-06-strategi/04-6-4-value-chain.partial.html",
      "bab-06-strategi/05-6-5-kelembagaan.partial.html",

      // bab-07 implementasi
      "bab-07-implementasi/00-bab.partial.html",
      "bab-07-implementasi/01-7-1-proses.partial.html",
      "bab-07-implementasi/02-7-2-stakeholder.partial.html",
      "bab-07-implementasi/03-7-3-intervensi.partial.html",
      "bab-07-implementasi/04-7-4-output.partial.html",
      "bab-07-implementasi/05-7-5-outcome.partial.html",
      "bab-07-implementasi/06-7-6-toc.partial.html",
      "bab-07-implementasi/07-7-7-input-investasi.partial.html",
      "bab-07-implementasi/08-7-8-fiksasi-dampak.partial.html",
      "bab-07-implementasi/09-7-9-monetisasi.partial.html",
      "bab-07-implementasi/10-7-10-lfa-table.partial.html",
      "bab-07-implementasi/11-7-11-nilai-sroi.partial.html",

      // bab-08 triple loop learning
      "bab-08-triple-loop-learning/00-bab.partial.html",
      "bab-08-triple-loop-learning/01-8-1-identifikasi.partial.html",
      "bab-08-triple-loop-learning/02-8-2-rencana-tindaklanjut.partial.html",
      "bab-08-triple-loop-learning/03-8-3-keunikan.partial.html",
      "bab-08-triple-loop-learning/04-8-4-kontribusi.partial.html",

      // bab-09 penutup
      "bab-09-penutup/00-bab.partial.html",
      "bab-09-penutup/01-9-1-kesimpulan.partial.html",
      "bab-09-penutup/02-9-2-rekomendasi.partial.html",

      // bab-10 komponensi penyusun
      "bab-10-komponensi-penyusun/00-bab.partial.html",
      "bab-10-komponensi-penyusun/01-10-1-internal.partial.html",
      "bab-10-komponensi-penyusun/02-10-2-kompetensi.partial.html"
    ];

    const $doc = document.getElementById("doc");
    const $loading = document.getElementById("loading");

    function setStatus(text, isErr=false){
      if(!$loading) return;
      $loading.firstChild.nodeValue = text;
      $loading.classList.toggle("err", !!isErr);
    }

    async function fetchText(path){
      const res = await fetch(path, { cache: "no-store" });
      if(!res.ok) throw new Error(`${res.status} ${res.statusText} — ${path}`);
      return await res.text();
    }

    function extractBody(html){
      // If file contains a full HTML doc, take body; otherwise return as-is
      const hasBody = /<body[^>]*>/i.test(html);
      if(!hasBody) return html;
      const m = html.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
      return m ? m[1] : html;
    }

    async function loadAll(){
      setStatus("Memuat bab & sub-bab…");
      const chunks = [];
      for(let i=0;i<PARTIALS.length;i++){
        const p = PARTIALS[i];
        setStatus(`Memuat: ${p}`);
        const html = await fetchText(p);
        chunks.push(`\n<!-- ${p} -->\n` + extractBody(html));
      }
      $doc.innerHTML = chunks.join("\n");
    }

    async function paginate(){
      setStatus("Menerapkan pagination (Paged.js)…");
      // Paged.js auto-runs on DOMContentLoaded by default,
      // but in our case we inject content AFTER load, so we trigger preview manually.
      if(window.PagedPolyfill && typeof window.PagedPolyfill.preview === "function"){
        await window.PagedPolyfill.preview();
      }else if(window.Paged && window.Paged.Previewer){
        const previewer = new window.Paged.Previewer();
        await previewer.preview($doc.innerHTML, ["styles/master.css"]);
      }else{
        throw new Error("Paged.js tidak terdeteksi. CDN blocked atau script gagal load.");
      }
      if($loading) $loading.remove();
    }

    (async function boot(){
      try{
        await loadAll();
        await paginate();
      }catch(err){
        console.error(err);
        setStatus("Gagal menyusun dokumen. Buka Console untuk detail.", true);
        if($loading){
          const small = document.createElement("small");
          small.textContent = String(err && err.message ? err.message : err);
          $loading.appendChild(small);
        }
      }
    })();
  </script>
</body>
</html>
